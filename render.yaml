# Render Blueprint: everything on Render's free tier, no other accounts and no keys to copy.
# - one free web service runs the API and serves the Angular app on the same address
# - one free PostgreSQL database holds the data and the plan PDFs (STORAGE_DRIVER=database)
# - the public address is detected automatically (RENDER_EXTERNAL_URL)
# - billing is switched off: every company has full access
# Note: Render deletes free databases 30 days after creation. See docs/DEPLOY.md.
databases:
  - name: electro-house-db
    plan: free
    region: frankfurt
    databaseName: electro
    user: electro

services:
  - type: web
    name: electro-house
    runtime: node
    plan: free
    region: frankfurt
    # devDependencies are needed to build (TypeScript, Angular CLI, Prisma CLI).
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending database migrations, then starts the server.
    startCommand: npm run db:deploy -w @electro/api && node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: electro-house-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: database
      - key: BILLING_PROVIDER
        value: none
      # Your email (the product owner): opens the admin panel at /admin. Filled in on the Render dashboard.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
