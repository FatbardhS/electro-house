# Render Blueprint: one free web service runs the API and serves the Angular app on the same address.
# Database and file storage are external (Supabase free tier). See docs/DEPLOY.md.
services:
  - type: web
    name: electro-house
    runtime: node
    plan: free
    region: frankfurt
    # devDependencies are needed to build (TypeScript, Angular CLI, Prisma CLI).
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending database migrations, then starts the server.
    startCommand: npm run db:deploy -w @electro/api && node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # The public address of this service, e.g. https://electro-house.onrender.com (no trailing slash).
      - key: WEB_ORIGIN
        sync: false
      # Supabase → Connect → Session pooler connection string (port 5432).
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      # Supabase → Storage → S3 connection.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: plans
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Plans are streamed through the API: no presigned URLs or bucket CORS needed.
      - key: S3_PROXY_READS
        value: "true"
      # Billing is switched off for testing: every company has full access.
      - key: BILLING_PROVIDER
        value: none
